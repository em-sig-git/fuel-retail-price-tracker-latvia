name: Check Virsi collection

on:
  pull_request:
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/check_virsi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virsi:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt seleniumbase==4.56.3
      - name: Check live Virsi collection through CDP
        run: |
          python - <<'PY'
          import json
          from unittest.mock import patch
          import requests
          from seleniumbase import SB
          from src.fuel_retail_price_tracker_latvia.scrapers.latvia import VirsiScraper
          from src.fuel_retail_price_tracker_latvia.utils import timestamp_now_iso
          from src.fuel_retail_price_tracker_latvia.validation import validate_brand_records

          url = VirsiScraper.source_url
          with SB(uc=True, test=True, xvfb=True, locale="lv", guest=True) as sb:
              sb.activate_cdp_mode(url)
              print(f"WebDriver connected during verification: {sb.is_connected()}", flush=True)
              print(f"Initial page title: {sb.cdp.get_title()}", flush=True)
              sb.solve_captcha()
              sb.cdp.wait_for_element(".price-card p.price span:nth-child(2)", timeout=35)
              html = sb.cdp.get_page_source()
              print(f"Final page title: {sb.cdp.get_title()}", flush=True)

          with requests.Session() as session:
              scraper = VirsiScraper(session)
              with patch.object(scraper, "_fetch_price_html", return_value=html):
                  rows = [record.to_dict() for record in scraper.scrape(timestamp_now_iso())]
          validate_brand_records("Virši", rows)
          print(f"VERIFIED: {len(rows)} live Virši records through CDP", flush=True)
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY
