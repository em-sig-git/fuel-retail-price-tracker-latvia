name: Check Virsi collection

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/check_virsi.yml"
      - ".github/workflows/scrape_fuel_prices.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  virsi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify live Virsi records without updating CSV
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m src.fuel_retail_price_tracker_latvia.check_virsi
          else
            python -m src.fuel_retail_price_tracker_latvia.check_virsi
          fi
